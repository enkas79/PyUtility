name: Build PyUtilitySuite (Windows & Linux)

on:
  push:
    branches: [ main ]
    paths:
      - 'version.txt' # La pipeline parte solo se cambia la versione
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # JOB 0: TEST E LINT (blocca la release se falliscono)
  # ==========================================
  tests:
    uses: ./.github/workflows/tests.yml

  # ==========================================
  # JOB 1: WINDOWS (EXE + INSTALLER)
  # ==========================================
  build-windows:
    needs: tests
    runs-on: windows-latest
    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Leggi la versione da version.txt
      shell: bash
      run: |
        VERSION=$(cat version.txt)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Configurazione Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installazione dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Creazione EXE Unico (PyInstaller)
      # I tool sono caricati dinamicamente da src/main.py (importlib): vanno dichiarati con --hidden-import
      run: |
        pyinstaller --noconsole --onefile --name "PyUtilitySuite" --collect-all pdf2docx --hidden-import ConvImage --hidden-import MergeImage --hidden-import Image_Watermark --hidden-import Find_Document --hidden-import File_Lister --hidden-import PDF_plus --hidden-import PDF_Splitter --hidden-import PDFtoWord --icon icon.ico --paths src --add-data "version.txt;." --add-data "assets/icon.png;assets" src/main.py

    - name: Creazione script Inno Setup (.iss)
      run: |
        # Controlla se l'icona esiste e prepara la riga di configurazione
        $iconLine = ""
        if (Test-Path "icon.ico") {
            $iconLine = "SetupIconFile=icon.ico"
         }
          
        $issContent = @"
        [Setup]
        AppName=PyUtilitySuite
        AppVersion=$env:VERSION
        AppPublisher=Enrico Martini
        DefaultDirName={autopf}\PyUtilitySuite
        DefaultGroupName=PyUtilitySuite
        OutputDir=Output_Installer
        OutputBaseFilename=PyUtilitySuite_Setup_v$env:VERSION
        Compression=lzma2
        SolidCompression=yes
        PrivilegesRequired=admin
        $iconLine
          
        [Files]
        Source: "dist\PyUtilitySuite.exe"; DestDir: "{app}"; Flags: ignoreversion
          
        [Icons]
        Name: "{group}\PyUtilitySuite"; Filename: "{app}\PyUtilitySuite.exe"
        Name: "{autodesktop}\PyUtilitySuite"; Filename: "{app}\PyUtilitySuite.exe"
        "@
        Set-Content -Path "setup_config.iss" -Value $issContent

    - name: Compilazione Installer (Inno Setup)
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup_config.iss

    - name: Calcolo checksum SHA-256 (verificati dall'autoupdate)
      run: |
        foreach ($f in @("dist\PyUtilitySuite.exe", "Output_Installer\PyUtilitySuite_Setup_v$env:VERSION.exe")) {
          $hash = (Get-FileHash -Algorithm SHA256 -Path $f).Hash.ToLower()
          $name = Split-Path $f -Leaf
          Set-Content -Path "$f.sha256" -Value "$hash  $name" -Encoding ascii
        }

    - name: Pubblica la Release su GitHub (Windows)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: PyUtilitySuite v${{ env.VERSION }}
        body: "Aggiornamento automatico della suite di utility."
        files: |
          dist/PyUtilitySuite.exe
          dist/PyUtilitySuite.exe.sha256
          Output_Installer/PyUtilitySuite_Setup_v${{ env.VERSION }}.exe
          Output_Installer/PyUtilitySuite_Setup_v${{ env.VERSION }}.exe.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 2: LINUX (DEB PACKAGE)
  # ==========================================
  build-linux:
    needs: tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Leggi la versione da version.txt
      shell: bash
      run: |
        VERSION=$(cat version.txt)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Installazione dipendenze sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick dpkg-dev

    - name: Configurazione Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installazione dipendenze Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Creazione Eseguibile Linux (PyInstaller)
      # I tool sono caricati dinamicamente da src/main.py (importlib): vanno dichiarati con --hidden-import
      run: |
        pyinstaller --noconsole --onefile --name "PyUtilitySuite" --collect-all pdf2docx --hidden-import ConvImage --hidden-import MergeImage --hidden-import Image_Watermark --hidden-import Find_Document --hidden-import File_Lister --hidden-import PDF_plus --hidden-import PDF_Splitter --hidden-import PDFtoWord --paths src --add-data "version.txt:." --add-data "assets/icon.png:assets" src/main.py

    - name: Impacchettamento Debian (.deb)
      run: |
        VERSION=${{ env.VERSION }}
        DEB_DIR="PyUtilitySuite_v${VERSION}_amd64"
        mkdir -p $DEB_DIR/DEBIAN
        mkdir -p $DEB_DIR/opt/PyUtilitySuite
        mkdir -p $DEB_DIR/usr/share/applications
        mkdir -p $DEB_DIR/usr/share/icons/hicolor/256x256/apps
        cp assets/icon.png $DEB_DIR/usr/share/icons/hicolor/256x256/apps/pyutility-suite.png

        cp dist/PyUtilitySuite $DEB_DIR/opt/PyUtilitySuite/
        chmod +x $DEB_DIR/opt/PyUtilitySuite/PyUtilitySuite

        cat <<EOF > $DEB_DIR/DEBIAN/control
        Package: pyutility-suite
        Version: ${VERSION}
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: Enrico Martini
        Description: Suite di utility per PDF, immagini e documenti.
        EOF

        cat <<EOF > $DEB_DIR/usr/share/applications/pyutility.desktop
        [Desktop Entry]
        Version=${VERSION}
        Name=PyUtilitySuite
        Exec=/opt/PyUtilitySuite/PyUtilitySuite
        Icon=pyutility-suite
        Terminal=false
        Type=Application
        Categories=Utility;
        EOF

        dpkg-deb --build $DEB_DIR
        # Checksum SHA-256 verificato dall'autoupdate (formato sha256sum)
        sha256sum "${DEB_DIR}.deb" > "${DEB_DIR}.deb.sha256"

    - name: Pubblica la Release su GitHub (Linux)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        files: |
          PyUtilitySuite_v${{ env.VERSION }}_amd64.deb
          PyUtilitySuite_v${{ env.VERSION }}_amd64.deb.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
